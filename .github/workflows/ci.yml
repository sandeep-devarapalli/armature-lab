name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.114.0
      - run: supabase start
      - run: supabase test db supabase/tests/database
      - run: supabase/tests/concurrent_booking.sh
      - if: always()
        run: supabase stop --no-backup

  deploy-production:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs:
      - frontend
      - database
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://armaturelab.org
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SITE_URL: https://armaturelab.org
      VITE_MEMBER_PLATFORM_ENABLED: 'false'
      VITE_COMPONENT_REQUESTS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:production
      - run: >-
          npx wrangler pages deploy dist
          --project-name armature-lab
          --branch main
          --commit-hash ${{ github.sha }}
